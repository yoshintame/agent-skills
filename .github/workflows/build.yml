name: Build skill packs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: oven-sh/setup-bun@v2

      - name: Check pinned skill imports
        run: bun scripts/check-skill-imports.ts

      - run: uv tool install apm-cli

      - name: Read version from apm.yml
        id: version
        run: |
          version=$(grep '^version:' apm.yml | head -1 | awk '{print $2}')
          sha=$(git rev-parse --short HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}+${sha}" >> "$GITHUB_OUTPUT"

      - name: Build APM bundle
        run: apm pack --force

      - name: Build individual skill zips for claude.ai
        run: |
          out=build/claude-ai-skills
          mkdir -p "$out"
          for dir in .apm/skills/*/; do
            name=$(basename "$dir")
            (cd .apm/skills && zip -r "../../$out/$name.zip" "$name/")
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            --title "Build ${{ steps.version.outputs.version }} (${{ github.sha }})" \
            --notes "Auto-built from $(git log -1 --format='%s') ($(git rev-parse --short HEAD))" \
            --latest \
            build/claude-ai-skills/*.zip
